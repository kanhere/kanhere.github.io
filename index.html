<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171E" media="(prefers-color-scheme: dark)">
<title>Akshay Kanhere</title>
<meta name="description" content="I make an innovation team's operations easier with technical solutions: automations, data plumbing and, lately, a lot of agents.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>
(function () {
  try {
    var t = localStorage.getItem('ak-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/viz-more.css">
</head>
<body>
<a class="skip sr-only" id="skip-link" href="#approach"></a>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="brand" id="brand" href="#top">
      <img class="brand__mark" src="assets/mark.svg" alt="" width="28" height="28">
      <span class="brand__name" id="brand-name"></span>
    </a>
    <nav class="topnav" id="topnav"></nav>
    <div class="topbar__tools">
      <div class="lang" id="lang-switch" role="group"></div>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </div>
  </div>
</header>

<main id="main">

  <section id="top" class="hero reveal" aria-labelledby="hero-title">
    <div class="wrap hero__grid">
      <div class="hero__text" id="hero-text"></div>
      <figure class="hero__art" id="hero-art"></figure>
    </div>
  </section>

  <section id="approach" class="sec sec--band reveal" aria-labelledby="approach-title">
    <div class="wrap" id="approach-root"></div>
  </section>

  <section id="journey" class="sec reveal" aria-labelledby="journey-title">
    <div class="wrap" id="journey-root"></div>
  </section>

  <section id="work" class="sec sec--band reveal" aria-labelledby="work-title">
    <div class="wrap" id="work-root"></div>
  </section>

  <section id="projects" class="sec">
    <div class="wrap"><div id="projects-root"></div></div>
  </section>

  <section id="notes" class="sec reveal" aria-labelledby="notes-title">
    <div class="wrap" id="notes-root"></div>
  </section>

  <section id="toolbox" class="sec sec--tight reveal" aria-labelledby="toolbox-title">
    <div class="wrap" id="toolbox-root"></div>
  </section>

  <section id="personal" class="sec reveal" aria-labelledby="personal-title">
    <div class="wrap" id="personal-root"></div>
  </section>

  <section id="connect" class="sec sec--band reveal" aria-labelledby="connect-title">
    <div class="wrap" id="connect-root"></div>
  </section>

</main>

<footer class="footer">
  <div class="wrap" id="footer-root"></div>
</footer>

<noscript>
  <p class="noscript wrap">Akshay Kanhere, Associate, Technology Operations, UpLink, World Economic Forum.
    <a href="https://www.linkedin.com/in/akshaykanhere" rel="noopener">LinkedIn</a></p>
</noscript>

<script src="js/data.js"></script>
<script src="js/data.fr.js"></script>
<script src="js/data.de.js"></script>
<script src="js/lang.js"></script>
<script src="js/qr.js"></script>
<script src="js/site.js"></script>
<script src="js/viz-more.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
